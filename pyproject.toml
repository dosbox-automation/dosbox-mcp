[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dosbox-mcp"
version = "0.2.1"
description = "MCP server for dosbox-automation: drive a DOS machine from an AI agent"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = [
    "LICENSE",
    "licenses/GPL-2.0-or-later.txt",
    "licenses/CC-BY-SA-4.0.txt",
    "THIRD_PARTY_LICENSES.txt",
]
authors = [
    { name = "dosbox-mcp contributors", email = "dosbox-mcp@trinity2k.net" },
]
keywords = [
    "dosbox",
    "mcp",
    "model-context-protocol",
    "automation",
    "emulator",
    "dos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]
dependencies = [
    "mcp>=2,<3",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "platformdirs>=4",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://dosbox-automation.org"
Repository = "https://github.com/dosbox-automation/dosbox-mcp"
Issues = "https://github.com/dosbox-automation/dosbox-mcp/issues"

[project.scripts]
dosbox-mcp = "dosbox_mcp.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit"]

[tool.setuptools.packages.find]
include = ["dosbox_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
